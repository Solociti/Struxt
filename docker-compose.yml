services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    attach: ${ATTACH_DB_LOGS:-true}
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGODB_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGODB_PASSWORD}
    healthcheck:
      # found this health check on stackoverflow. not sure why the grep is needed
      # https://www.mongodb.com/docs/manual/reference/command/serverStatus/
      test: echo 'db.runCommand({serverStatus:1}).ok' | mongosh admin -u ${MONGODB_USERNAME} -p ${MONGODB_PASSWORD} --quiet | grep 1
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      autoheal-app: true
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
      - ${BACKUP_DIR}:/backup/
    networks:
      - struxt-net

  victoriametrics:
    image: victoriametrics/victoria-metrics:stable
    restart: unless-stopped
    attach: ${ATTACH_DB_LOGS:-true}
    ports:
      - "127.0.0.1:8428:8428"
    volumes:
      - ./config/victoria-metrics/victoria-metrics.yml:/etc/victoria-metrics/victoria-metrics.yml:ro
      - victoria_metrics_data:/victoria-metrics-data
      - ${BACKUP_DIR}:/backup/
    command:
      - -selfScrapeInterval=60s
      - -storageDataPath=/victoria-metrics-data
      - -promscrape.config=/etc/victoria-metrics/victoria-metrics.yml
      - -memory.allowedPercent=20
      - -retentionPeriod=1y
    # No health checks for now. Might have to do a custom container to add health checks
    # curl isn't present in the docker container
    networks:
      - struxt-net

  grafana:
    image: grafana/grafana:main
    restart: unless-stopped
    attach: ${ATTACH_DB_LOGS:-true}
    environment:
      - GF_PLUGINS_PREINSTALL=victoriametrics-metrics-datasource
    healthcheck:
      test: curl --fail http://localhost:3000/health --max-time 5 --connect-timeout 5 || exit 1
      interval: 5m
      timeout: 6s
      retries: 5
      start_period: 30s
    labels:
      autoheal-app: true
    ports:
      - "127.0.0.1:3030:3000"
    volumes:
      - "grafana_data:/var/lib/grafana"
      - "./config/grafana:/etc/grafana/provisioning:ro"
      - ${BACKUP_DIR}:/backup/
    networks:
      - struxt-net

  dragonfly:
    image: "docker.dragonflydb.io/dragonflydb/dragonfly"
    ulimits:
      memlock: -1
    command: "dragonfly --flagfile=/flags.txt"
    attach: ${ATTACH_DB_LOGS:-true}
    healthcheck:
      test: redis-cli -h localhost ping
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      autoheal-app: true
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - dragonflydata:/data
      - ./config/dragonFlyFlags.txt:/flags.txt
    networks:
      - struxt-net

  nginx:
    image: "jc21/nginx-proxy-manager:latest"
    restart: unless-stopped
    attach: ${ATTACH_DB_LOGS:-true}
    healthcheck:
      test: ["CMD", "/usr/bin/check-health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
    labels:
      autoheal-app: true
    ports:
      - "80:80"
      - "127.0.0.1:81:81"
      - "443:443"
    volumes:
      - nginx_data:/data
      - nginx_letsencrypt:/etc/letsencrypt
      - ${BACKUP_DIR}:/backup/
    networks:
      - struxt-net

volumes:
  dragonflydata:
  grafana_data:
  mariadb_data:
  mongo_data:
  nginx_data:
  nginx_letsencrypt:
  victoria_metrics_data:

networks:
  struxt-net:
