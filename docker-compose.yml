services:
  mariadb:
    image: mariadb:latest
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - struxt-net
    profiles:
      - dev
      - prod

  editor-api:
    image: node:20:18
    environment:
      - IS_DOCKER=true
    working_dir: /app
    volumes:
      - .:/app
    command: npm start
    depends_on:
      - mariadb
      - nginx
    # ports:
    #   - "127.0.0.1:3000:3000"
    networks:
      - struxt-net
    profiles:
      - prod

  nginx:
    image: nginx:latest
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    networks:
      - struxt-net

    profiles:
      - prod

volumes:
  mariadb_data:

networks:
  struxt-net:
