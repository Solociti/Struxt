services:
  mariadb:
    image: mariadb:latest
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - struxt-net
    profiles:
      - dev
      - prod

  dragonfly:
    image: "docker.dragonflydb.io/dragonflydb/dragonfly"
    ulimits:
      memlock: -1
    ports:
      - "6379:6379"
    volumes:
      - dragonflydata:/data
      - ./config/dragonFlyFlags.txt:/flags.txt
    networks:
      - struxt-net
    command: "dragonfly --flagfile=/flags.txt"
    profiles:
      - dev
      - prod

  web-host:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    scale: 2
    env_file:
      - .env
    environment:
      - IS_DOCKER=true
      - UPLOAD_DIR=/uploads
    command: "node server/publicHost.js"
    volumes:
      - ${UPLOAD_DIR}:/uploads
      - ${SITE_STORAGE_DIR}:/sites
      - .env:/app/.env:ro
    depends_on:
      - mariadb
      - dragonfly
      - nginx
    # ports:
    #   - "127.0.0.1:3000:3000"
    networks:
      - struxt-net
    profiles:
      - prod

  web-host-dev:
    build:
      context: .
      dockerfile: dev.Dockerfile
    env_file:
      - .env
    environment:
      - IS_DOCKER=true
      - UPLOAD_DIR=/uploads
    command: "tsx watch --clear-screen=false server/publicHost.ts"
    volumes:
      - .:/app
      - ${UPLOAD_DIR}:/uploads
      - ${SITE_STORAGE_DIR}:/sites
    depends_on:
      - mariadb
      - dragonfly
      - nginx
    networks:
      - struxt-net
    profiles:
      - dev

  editor-api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    scale: 1
    env_file:
      - .env
    environment:
      - IS_DOCKER=true
      - UPLOAD_DIR=/uploads
    command: "node server/apiEntry.js"
    volumes:
      - ${UPLOAD_DIR}:/uploads
      - ${SITE_STORAGE_DIR}:/sites
      - .env:/app/.env:ro
    depends_on:
      - mariadb
      - dragonfly
      - nginx
    # ports:
    #   - "127.0.0.1:3000:3000"
    networks:
      - struxt-net
    profiles:
      - prod

  editor-api-dev:
    build:
      context: .
      dockerfile: dev.Dockerfile
    env_file:
      - .env
    environment:
      - IS_DOCKER=true
      - UPLOAD_DIR=/uploads
    command: "tsx watch --clear-screen=false server/apiEntry.ts"
    volumes:
      - .:/app
      - ${UPLOAD_DIR}:/uploads
      - ${SITE_STORAGE_DIR}:/sites
    depends_on:
      - mariadb
      - dragonfly
      - nginx
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - struxt-net
    profiles:
      - dev

  nginx:
    image: "jc21/nginx-proxy-manager:latest"
    restart: unless-stopped
    ports:
      - "80:80"
      - "127.0.0.1:81:81"
      - "443:443"
    volumes:
      - nginx_data:/data
      - nginx_letsencrypt:/etc/letsencrypt
    networks:
      - struxt-net
    profiles:
      - prod
      - dev

  keycloak:
    build:
      context: ./keycloak
      dockerfile: keycloak.Dockerfile
    restart: unless-stopped
    command: "start --optimized --http-enabled true"
    environment:
      - KC_HEALTH_ENABLED=true
      - KC_HOSTNAME=${KEYCLOAK_HOSTNAME}
      - KC_ADMIN_HOSTNAME=${KEYCLOAK_ADMIN_HOSTNAME}
      - KC_DB_URL=jdbc:mariadb://mariadb:3306/keycloak
      - KC_DB_USERNAME=keycloak
      - KC_DB_PASSWORD=${KEYCLOAK_DB_PASSWORD}
      - KC_DB_POOL_MAX_SIZE=25
    ports:
      - "127.0.0.1:8443:8443"
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9000:9000"
    networks:
      - struxt-net
    profiles:
      - prod
    depends_on:
      - mariadb

volumes:
  mariadb_data:
  nginx_data:
  nginx_letsencrypt:
  dragonflydata:

networks:
  struxt-net:
