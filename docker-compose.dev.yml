services:
  ts-build:
    build:
      context: .
      dockerfile: dev.Dockerfile
    user: "1000:1000"
    command: |
      npx tsc -p server/tsconfig.json --watch --preserveWatchOutput
    volumes:
      - ./node_modules/:/app/node_modules
      - ./docker-package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json
      - .env:/app/.env:ro
      - ./common/:/app/common
      - ./server/:/app/server
      - ./tsconfig.json:/app/tsconfig.json
    networks:
      - struxt-net

  babel-build-1:
    build:
      context: .
      dockerfile: dev.Dockerfile
    user: "1000:1000"
    command: |
      npx babel server --out-dir dist-server/server --extensions '.ts,.js' --watch
    volumes:
      - ./node_modules/:/app/node_modules
      - ./docker-package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json
      - .env:/app/.env:ro
      - ./common/:/app/common
      - ./server/:/app/server
      - ./dist-server/:/app/dist-server
      - ./tsconfig.json:/app/tsconfig.json
      - ./babel.config.json:/app/babel.config.json
      - ./babel:/app/babel
    networks:
      - struxt-net
  babel-build-2:
    build:
      context: .
      dockerfile: dev.Dockerfile
    user: "1000:1000"
    command: |
      npx babel common --out-dir dist-server/common --extensions '.ts,.js' --watch
    volumes:
      - ./node_modules/:/app/node_modules
      - ./docker-package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json
      - .env:/app/.env:ro
      - ./common/:/app/common
      - ./server/:/app/server
      - ./dist-server/:/app/dist-server
      - ./tsconfig.json:/app/tsconfig.json
      - ./babel.config.json:/app/babel.config.json
      - ./babel:/app/babel
    networks:
      - struxt-net

  web-host:
    build:
      context: .
      dockerfile: dev.Dockerfile
    user: "1000:1000"
    env_file:
      - .env
    environment:
      - IS_DOCKER=true
      - UPLOAD_DIR=/uploads
      - CONTAINER_NAME=web-host
      - GEOTMPDIR=/uploads/geoip/tmp
      - GEODATADIR=/uploads/geoip/data
    command: bash -c "sleep 10 && nodemon --delay 2 server/publicHost.js"
    healthcheck:
      test: curl --fail http://localhost:3000/hc --max-time 5 --connect-timeout 5 || exit 1
      interval: 1m
      timeout: 6s
      retries: 5
      start_period: 30s
    volumes:
      - ./node_modules/:/app/node_modules
      - ./docker-package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json
      - .env:/app/.env:ro
      - ./dist-server/common:/app/common
      - ./dist-server/server:/app/server
      - ./templates:/app/templates
      - ./client/dist:/app/client/dist
      - ${UPLOAD_DIR}:/uploads
      - ${SITE_STORAGE_DIR}:/sites
    depends_on:
      - dragonfly
      - nginx
      - ts-build
    networks:
      - struxt-net

  editor-api:
    build:
      context: .
      dockerfile: dev.Dockerfile
    user: "1000:1000"
    env_file:
      - .env
    environment:
      - IS_DOCKER=true
      - UPLOAD_DIR=/uploads
      - CONTAINER_NAME=editor-api
      - GEOTMPDIR=/uploads/geoip/tmp
      - GEODATADIR=/uploads/geoip/data
    command: bash -c "sleep 10 && nodemon --delay 2 server/apiEntry.js"
    healthcheck:
      test: curl --fail http://localhost:3000/hc --max-time 5 --connect-timeout 5 || exit 1
      interval: 1m
      timeout: 6s
      retries: 5
      start_period: 30s
    volumes:
      - ./node_modules/:/app/node_modules
      - ./package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json
      - .env:/app/.env:ro
      - ./dist-server/common:/app/common
      - ./dist-server/server:/app/server
      - ./templates:/app/templates
      - ./client/dist/:/app/client/dist
      - ${UPLOAD_DIR}:/uploads
      - ${SITE_STORAGE_DIR}:/sites
    depends_on:
      - dragonfly
      - nginx
      - ts-build
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - struxt-net

  puppeteer:
    build:
      context: .
      dockerfile: dev-puppeteer.Dockerfile
    user: "1000:1000"
    env_file:
      - .env
    environment:
      - IS_DOCKER=true
      - UPLOAD_DIR=/uploads
      - CONTAINER_NAME=puppeteer
      - GEOTMPDIR=/uploads/geoip/tmp
      - GEODATADIR=/uploads/geoip/data
    command: bash -c "sleep 10 && nodemon --delay 2 server/puppeteerEntry.js"
    healthcheck:
      test: curl --fail http://localhost:3000/hc --max-time 5 --connect-timeout 5 || exit 1
      interval: 1m
      timeout: 6s
      retries: 5
      start_period: 30s
    volumes:
      - ./node_modules/:/app/node_modules
      - ./package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json
      - .env:/app/.env:ro
      - ./dist-server/common:/app/common
      - ./dist-server/server:/app/server
      - ./templates:/app/templates
      - ./client/dist/:/app/client/dist
      - ${UPLOAD_DIR}:/uploads
      - ${SITE_STORAGE_DIR}:/sites
    depends_on:
      - dragonfly
      - nginx
      - ts-build
    cap_add:
      - SYS_ADMIN
    networks:
      - struxt-net
