# Apply these roles to fission kubernetes with `kubectl apply -f struxt-fission-binding.yaml`
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: struxt-fission-limited-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: struxt-fission-limited
subjects:
  - kind: ServiceAccount
    name: struxt-fission-client-dev
    namespace: fission
  - kind: ServiceAccount
    name: struxt-fission-client-staging
    namespace: fission
  - kind: ServiceAccount
    name: struxt-fission-client-prod
    namespace: fission
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: struxt-fission-secret-manager-binding
  namespace: default # This restricts the scope to the default namespace
subjects:
  - kind: ServiceAccount
    name: struxt-fission-client-dev
    namespace: fission
  - kind: ServiceAccount
    name: struxt-fission-client-staging
    namespace: fission
  - kind: ServiceAccount
    name: struxt-fission-client-prod
    namespace: fission
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: struxt-fission-secret-manager 