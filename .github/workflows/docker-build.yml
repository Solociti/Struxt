name: Build and Push Docker Images

on:
  release:
    types: [published]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to GitHub Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name | toLowerCase }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name | toLowerCase }}:${{ github.event.release.tag_name }}

      - name: Build and push Keycloak Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./keycloak
          file: keycloak.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name | toLowerCase }}-keycloak:latest
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name | toLowerCase }}-keycloak:${{ github.event.release.tag_name }}
