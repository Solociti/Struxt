services:
  web-host:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    scale: 2
    env_file:
      - .env
    environment:
      - IS_DOCKER=true
      - UPLOAD_DIR=/uploads
    command: "node server/publicHost.js"
    volumes:
      - ${UPLOAD_DIR}:/uploads
      - ${SITE_STORAGE_DIR}:/sites
      - .env:/app/.env:ro
    depends_on:
      - mariadb
      - dragonfly
      - nginx
    networks:
      - struxt-net

  editor-api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    scale: 1
    env_file:
      - .env
    environment:
      - IS_DOCKER=true
      - UPLOAD_DIR=/uploads
    command: "node server/apiEntry.js"
    volumes:
      - ${UPLOAD_DIR}:/uploads
      - ${SITE_STORAGE_DIR}:/sites
      - .env:/app/.env:ro
    depends_on:
      - mariadb
      - dragonfly
      - nginx
    networks:
      - struxt-net

  keycloak:
    build:
      context: ./keycloak
      dockerfile: keycloak.Dockerfile
    restart: unless-stopped
    command: "start --optimized --http-enabled true"
    environment:
      - KC_HEALTH_ENABLED=true
      - KC_HOSTNAME=${KEYCLOAK_HOSTNAME}
      - KC_ADMIN_HOSTNAME=${KEYCLOAK_ADMIN_HOSTNAME}
      - KC_DB_URL=jdbc:mariadb://mariadb:3306/keycloak
      - KC_DB_USERNAME=keycloak
      - KC_DB_PASSWORD=${KEYCLOAK_DB_PASSWORD}
      - KC_DB_POOL_MAX_SIZE=25
    ports:
      - "127.0.0.1:8443:8443"
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9000:9000"
    networks:
      - struxt-net
    depends_on:
      - mariadb
